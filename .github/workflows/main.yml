name: Ultimate-AI-Aimbot-Fixed
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & Generate Model
        run: |
          pip install ultralytics tensorflow
          python - <<EOF
          from ultralytics import YOLO
          model = YOLO('yolov8n.pt') 
          model.export(format='tflite', imgsz=160, int8=True, optimize=True)
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Android Project
        run: |
          # إنشاء هيكل المجلدات
          mkdir -p app/src/main/java/com/test/aimbot
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # نقل الموديل
          find . -name "*int8.tflite" -exec cp {} app/src/main/assets/model.tflite \;

          # إنشاء ملفات الإعدادات (Gradle Fixed)
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.test.aimbot'
              compileSdk 33
              defaultConfig {
                  applicationId "com.test.aimbot"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'org.tensorflow:tensorflow-lite:2.13.0'
              implementation 'org.tensorflow:tensorflow-lite-gpu:2.13.0'
              implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
          }
          EOF

          # إنشاء الـ Manifest والأكواد (نفس السابق)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.test.aimbot">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:label="AI-Test-Tool" android:theme="@android:style/Theme.DeviceDefault">
                  <service android:name=".AimService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                      <intent-filter><action android:name="android.view.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.view.AccessibilityService" android:resource="@xml/service_config"/>
                  </service>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<EOF > app/src/main/res/xml/service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true" android:description="@string/desc" />
          EOF
          echo '<resources><string name="desc">AI Vision Service</string></resources>' > app/src/main/res/values/strings.xml

          # إضافة كود الجافا (Simplified for Build)
          cat <<EOF > app/src/main/java/com/test/aimbot/AimService.java
          package com.test.aimbot;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          public class AimService extends AccessibilityService {
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}
          }
          EOF

          cat <<EOF > app/src/main/java/com/test/aimbot/MainActivity.java
          package com.test.aimbot;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) { super.onCreate(b); }
          }
          EOF

      - name: Build with Gradle Wrapper
        run: |
          # توليد الـ Wrapper يدوياً لتجنب خطأ No such file
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Aimbot-Fixed-APK
          path: app/build/outputs/apk/debug/*.apk

