name: Build Android APK

# هذا يجعل الـ Workflow يعمل يدويًا عند الضغط على زر
on:
  workflow_dispatch:

jobs:
  build:
    # سيتم تشغيل هذا على سيرفر Linux من GitHub
    runs-on: ubuntu-latest

    steps:
    # الخطوة 1: تجهيز بيئة Java (ضرورية لأندرويد)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الخطوة 2: إنشاء هيكل مجلدات المشروع من الصفر
    - name: Create Project Directory Structure
      run: |
        mkdir -p app/src/main/java/com/test/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    # الخطوة 3: كتابة ملفات الكود الأساسية ديناميكيًا
    - name: Write AndroidManifest.xml
      run: |
        echo '<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.test.app">
            <application
                android:allowBackup="true"
                android:label="Hello World App"
                android:theme="@android:style/Theme.Material.Light">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>' > app/src/main/AndroidManifest.xml

    - name: Write MainActivity.kt
      run: |
        echo 'package com.test.app

        import android.app.Activity
        import android.os.Bundle
        import android.widget.TextView

        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val textView = TextView(this)
                textView.text = "Hello from GitHub Actions!"
                textView.textSize = 24f
                setContentView(textView)
            }
        }' > app/src/main/java/com/test/app/MainActivity.kt

    - name: Write Gradle Build Scripts
      run: |
        echo '
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.2.0"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }' > build.gradle

        echo '
        plugins {
            id "com.android.application"
            id "kotlin-android"
        }
        android {
            namespace "com.test.app"
            compileSdkVersion 34
            defaultConfig {
                applicationId "com.test.app"
                minSdkVersion 26
                targetSdkVersion 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }' > app/build.gradle

    # الخطوة 4: بناء التطبيق باستخدام Gradle
    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleRelease

    # الخطوة 5: رفع ملف APK الناتج كـ "قطعة أثرية"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HelloWorldApp
        path: app/build/outputs/apk/release/app-release.apk
